name: Build macOS App

on:
  push:
    branches: [ main ]
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'macos/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Xcode
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: latest-stable

    - name: Make script executable
      run: chmod +x macos/GatewaySwitch/Scripts/gateway-manager.sh

    - name: Build Swift package
      run: |
        cd macos/GatewaySwitch
        swift build -c release

    - name: Create app bundle
      run: |
        cd macos/GatewaySwitch

        # Create app structure
        mkdir -p GatewaySwitch.app/Contents/MacOS
        mkdir -p GatewaySwitch.app/Contents/Resources/Scripts

        # Copy executable
        if [ -f .build/release/GatewaySwitch ]; then
          cp .build/release/GatewaySwitch GatewaySwitch.app/Contents/MacOS/
        elif [ -f .build/arm64-apple-macosx/release/GatewaySwitch ]; then
          cp .build/arm64-apple-macosx/release/GatewaySwitch GatewaySwitch.app/Contents/MacOS/
        elif [ -f .build/x86_64-apple-macosx/release/GatewaySwitch ]; then
          cp .build/x86_64-apple-macosx/release/GatewaySwitch GatewaySwitch.app/Contents/MacOS/
        else
          echo "Error: Cannot find built executable"
          ls -la .build/
          exit 1
        fi

        # Copy script
        cp Sources/GatewaySwitch/Scripts/gateway-manager.sh GatewaySwitch.app/Contents/Resources/Scripts/
        chmod +x GatewaySwitch.app/Contents/Resources/Scripts/gateway-manager.sh

        # Copy Info.plist from repo
        cp ../Info.plist GatewaySwitch.app/Contents/

        # Create PkgInfo
        echo -n "APPL????" > GatewaySwitch.app/Contents/PkgInfo

        # Ad-hoc code signing
        codesign --force --deep --sign - GatewaySwitch.app

    - name: Create DMG
      run: |
        cd macos/GatewaySwitch

        # Create temporary directory for DMG contents
        mkdir -p dmg
        cp -R GatewaySwitch.app dmg/

        # Create DMG
        hdiutil create -volname "GatewaySwitch" -srcfolder dmg -ov -format UDZO GatewaySwitch.dmg

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: GatewaySwitch-macOS
        path: macos/GatewaySwitch/GatewaySwitch.dmg
        retention-days: 30

    - name: Create Release (on tag)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: macos/GatewaySwitch/GatewaySwitch.dmg
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
