name: Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']          # 打 v 开头的 tag 时触发 release
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore packages
        run: nuget restore GatewaySwitch.csproj

      - name: Build
        run: msbuild GatewaySwitch.csproj /p:Configuration=Release /p:Platform="Any CPU"

      - name: Prepare release zip
        run: Compress-Archive -Path bin\Release\net48\GatewaySwitch.exe -DestinationPath GatewaySwitch-windows-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GatewaySwitch-windows
          path: GatewaySwitch-windows-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: GatewaySwitch-windows-x64.zip
          generate_release_notes: true
